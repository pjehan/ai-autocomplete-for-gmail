<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Autocomplete Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      color: #4285f4;
      font-size: 24px;
      font-weight: 500;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    input[type="number"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background-color: #4285f4;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background-color: #3367d6;
    }
    .help-text {
      font-size: 14px;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>Email Autocomplete Settings</h1>
  
  <div class="form-group">
    <label for="trigger-delay">Trigger Delay (ms)</label>
    <input type="number" id="trigger-delay" min="0" step="100" required>
    <div class="help-text">How long to wait after typing before generating suggestions (0-5000ms)</div>
  </div>
  
  <div class="form-group">
    <label for="language">Language</label>
    <select id="language">
      <option value="auto">Automatic (browser language)</option>
      <option value="en">English</option>
      <option value="es">Spanish</option>
      <option value="ja">Japanese</option>
    </select>
  </div>
  
  <button id="save-btn">Save</button>
  
  <script src="options.js"></script>
</body>
</html>
